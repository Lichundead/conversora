name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Una etiqueta no dispara ci.yml, así que sin esto una versión se podría
  # publicar desde un commit que nunca pasó las pruebas. Se invoca el mismo
  # workflow de CI en vez de duplicar aquí la matriz.
  verificar:
    name: Verificar
    uses: ./.github/workflows/ci.yml

  build:
    name: Empaquetar (${{ matrix.os }})
    needs: verificar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artefacto: CalculadoraDineroCOP-windows
            binario: dist/CalculadoraDineroCOP.exe
          - os: ubuntu-latest
            artefacto: CalculadoraDineroCOP-linux
            binario: dist/CalculadoraDineroCOP
          - os: macos-latest
            artefacto: CalculadoraDineroCOP-macos
            binario: dist/CalculadoraDineroCOP
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Construir ejecutable
        run: >
          pyinstaller --onefile --windowed --clean --noconfirm
          --name CalculadoraDineroCOP main.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: ${{ matrix.binario }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artefactos

      # Un binario por plataforma con el mismo nombre: los renombramos antes
      # de adjuntarlos para que la release no tenga colisiones.
      - name: Preparar binarios
        run: |
          mkdir -p entrega
          mv artefactos/CalculadoraDineroCOP-windows/CalculadoraDineroCOP.exe \
             "entrega/CalculadoraDineroCOP-${GITHUB_REF_NAME}-windows.exe"
          mv artefactos/CalculadoraDineroCOP-linux/CalculadoraDineroCOP \
             "entrega/CalculadoraDineroCOP-${GITHUB_REF_NAME}-linux"
          mv artefactos/CalculadoraDineroCOP-macos/CalculadoraDineroCOP \
             "entrega/CalculadoraDineroCOP-${GITHUB_REF_NAME}-macos"
          ls -la entrega

      - name: Crear la release en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "Calculadora de Dinero COP $GITHUB_REF_NAME"
          --generate-notes
          entrega/*
