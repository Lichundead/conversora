name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Una etiqueta no dispara ci.yml, así que sin esto una versión se podría
  # publicar desde un commit que nunca pasó las pruebas. Se invoca el mismo
  # workflow de CI en vez de duplicar aquí la matriz.
  verificar:
    name: Verificar
    uses: ./.github/workflows/ci.yml

  build:
    name: Empaquetar (${{ matrix.os }})
    needs: verificar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artefacto: CalculadoraDineroCOP-windows
            binario: dist/CalculadoraDineroCOP.exe
          - os: ubuntu-latest
            artefacto: CalculadoraDineroCOP-linux
            binario: CalculadoraDineroCOP-linux.tar.gz
          - os: macos-latest
            artefacto: CalculadoraDineroCOP-macos
            binario: CalculadoraDineroCOP-macos.zip
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Construir ejecutable (Windows y Linux)
        if: runner.os != 'macOS'
        run: >
          pyinstaller --onefile --windowed --clean --noconfirm
          --name CalculadoraDineroCOP main.py

      # En macOS, --onefile junto a --windowed está deprecado: un paquete .app
      # no puede ser un solo fichero, choca con la seguridad del sistema y
      # PyInstaller avisa de que será un error en su versión 7. Con --onedir
      # se obtiene el .app, que es la forma en que macOS espera una app.
      - name: Construir paquete .app (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --onedir --windowed --clean --noconfirm
          --name CalculadoraDineroCOP main.py

      # Los assets de una release son blobs planos: no conservan el modo
      # POSIX, así que un binario subido en crudo se descarga sin permiso de
      # ejecución y no arranca hasta hacerle chmod +x. En Windows no aplica,
      # pero en Linux y macOS hay que empaquetar. En macOS se usa ditto, que
      # es lo que conserva la estructura y los permisos de un .app.
      - name: Empaquetar para distribución (Linux)
        if: runner.os == 'Linux'
        run: tar -czf CalculadoraDineroCOP-linux.tar.gz -C dist CalculadoraDineroCOP

      - name: Empaquetar para distribución (macOS)
        if: runner.os == 'macOS'
        run: >
          ditto -c -k --keepParent
          dist/CalculadoraDineroCOP.app CalculadoraDineroCOP-macos.zip

      # Que el empaquetado no falle no prueba que el contenido sirva. Estas
      # comprobaciones fallan la build si se pierde el bit de ejecución o si
      # el .app no tiene la estructura que macOS necesita para arrancarlo.
      - name: Comprobar el paquete de Linux
        if: runner.os == 'Linux'
        run: |
          tar -tvzf CalculadoraDineroCOP-linux.tar.gz
          modo=$(tar -tvzf CalculadoraDineroCOP-linux.tar.gz \
                 | awk '$NF == "CalculadoraDineroCOP" {print $1}')
          echo "Modo del binario en el tar: $modo"
          case "$modo" in
            *x*) echo "Conserva el bit de ejecución" ;;
            *)   echo "ERROR: el binario no es ejecutable dentro del tar"; exit 1 ;;
          esac

      - name: Comprobar el paquete de macOS
        if: runner.os == 'macOS'
        run: |
          binario=CalculadoraDineroCOP.app/Contents/MacOS/CalculadoraDineroCOP
          unzip -l CalculadoraDineroCOP-macos.zip | head -20
          for esperado in \
              "CalculadoraDineroCOP.app/Contents/Info.plist" \
              "$binario"; do
            if ! unzip -l CalculadoraDineroCOP-macos.zip | grep -q "$esperado"; then
              echo "ERROR: falta $esperado en el .app"; exit 1
            fi
          done
          echo "El .app tiene Info.plist y su ejecutable en Contents/MacOS"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artefacto }}
          path: ${{ matrix.binario }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artefactos

      # Un binario por plataforma con el mismo nombre: los renombramos antes
      # de adjuntarlos para que la release no tenga colisiones.
      - name: Preparar binarios
        run: |
          mkdir -p entrega
          mv artefactos/CalculadoraDineroCOP-windows/CalculadoraDineroCOP.exe \
             "entrega/CalculadoraDineroCOP-${GITHUB_REF_NAME}-windows.exe"
          mv artefactos/CalculadoraDineroCOP-linux/CalculadoraDineroCOP-linux.tar.gz \
             "entrega/CalculadoraDineroCOP-${GITHUB_REF_NAME}-linux.tar.gz"
          mv artefactos/CalculadoraDineroCOP-macos/CalculadoraDineroCOP-macos.zip \
             "entrega/CalculadoraDineroCOP-${GITHUB_REF_NAME}-macos.zip"
          ls -la entrega

      - name: Crear la release en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "Calculadora de Dinero COP $GITHUB_REF_NAME"
          --generate-notes
          entrega/*
