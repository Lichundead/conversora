name: CI

# Las ramas se verifican por el evento pull_request, no por push. Si se
# escucharan los dos, un push a una rama con PR abierto lanzaría dos tandas
# sobre el mismo commit; cancelar una dejaría once checks en 'cancelled'
# colgados del commit y el PR en estado 'unstable' para siempre.
# Para verificar una rama antes de abrir el PR está workflow_dispatch.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  # Permite que release.yml exija esta misma verificación antes de publicar,
  # en vez de mantener una copia de la matriz de pruebas.
  workflow_call:

# Un push nuevo al mismo PR o rama descarta la tanda anterior, que ya está
# obsoleta. head_ref identifica la rama en un PR; ref_name, en un push.
#
# github.workflow entra en el grupo porque, cuando otro workflow invoca este
# con workflow_call, vale el nombre del que invoca ('Release') en lugar de
# 'CI'. Sin eso, la verificación que release.yml exige caería en el mismo
# grupo que una tanda normal de CI sobre la misma rama y una cancelaría a la
# otra, saltándose build y release en cascada.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar herramientas de desarrollo
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check --output-format=github .

  test:
    name: Tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Comprobar que tkinter está disponible
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      # Las pruebas de GUI necesitan un display. En Linux lo damos con Xvfb;
      # en Windows y macOS los runners ya traen uno.
      - name: Ejecutar tests (Linux, con Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -t . -v

      - name: Ejecutar tests (Windows / macOS)
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -t . -v

  build-check:
    name: Comprobar empaquetado
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      # Valida que el ejecutable se puede construir antes de etiquetar una
      # versión, para no descubrir el fallo solo al publicar la release.
      - name: Construir ejecutable de prueba
        run: >
          pyinstaller --onefile --windowed --clean --noconfirm
          --name CalculadoraDineroCOP main.py

      - name: Comprobar que el binario existe
        run: test -s dist/CalculadoraDineroCOP
