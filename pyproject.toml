[project]
name = "calculadora-dinero-cop"
version = "0.3.0"
description = "Aplicación de escritorio para contar y sumar efectivo en pesos colombianos."
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # la longitud la controla el formateador
    "SIM105",  # contextlib.suppress no siempre es más legible aquí
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
